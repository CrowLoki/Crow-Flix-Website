name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Audit npm dependencies
        run: npm audit --audit-level=moderate

      - name: Validate deployable site
        run: npm run check

      - name: Prepare free local media-fixture encoder
        timeout-minutes: 3
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi

      - name: Verify isolated browser and decoded-media behavior
        timeout-minutes: 8
        run: |
          export CROWFLIX_BROWSER="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          export FFMPEG_PATH="$(command -v ffmpeg)"
          test -n "$CROWFLIX_BROWSER" || { echo "Missing runner browser"; exit 1; }
          test -n "$FFMPEG_PATH" || { echo "Missing fixture encoder"; exit 1; }
          npm run acceptance:ci
